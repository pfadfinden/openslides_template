name: Build ARM template

on:
  push:
    branches: [main]
    paths:
      - 'os4machine.bicep'
      - 'vm.bicep'
      - 'cloud-init.yml'
      - '.github/workflows/build-template.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-template
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # azure/setup-bicep is blocked by the org's action allowlist, so install
      # the bicep binary directly instead of using the third-party action
      - name: Install bicep CLI
        run: |
          curl -sL --fail -o /tmp/bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x /tmp/bicep

      - name: Compile bicep templates
        run: |
          /tmp/bicep build os4machine.bicep --stdout > azuredeploy.json
          /tmp/bicep build vm.bicep --stdout > azuredeploy.rg.json

      - name: Commit regenerated templates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add azuredeploy.json azuredeploy.rg.json
          if git diff --cached --quiet; then
            echo "templates are already up to date"
          else
            git commit -m "chore: regenerate azuredeploy.json/azuredeploy.rg.json [skip ci]"
            git push
          fi
